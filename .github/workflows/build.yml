name: Build Regent-DREX

# 流程（2026-10-18 起）：
#   - 推送 main 或手动运行 = 只构建 QFun 标准 zip 并上传 Actions 产物；
#     不创建标签、不发布 Release（先构建、后测试）。
#   - 正式发布 = 维护者实测通过后手动执行（标签 + Release，附件与测试所用构建一致）。
#   - 历史：v4.2.1 起曾由 versionCode 驱动自动发版；v4.3 起恢复"先测试、后确认发布"。

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 读取版本
        id: info
        run: |
          set -euo pipefail
          ver=$(grep -m1 '^versionCode[[:space:]]*=' plugin/info.prop | sed 's/[^=]*=[[:space:]]*//' | tr -d ' \r')
          pid=$(grep -m1 '^id[[:space:]]*=' plugin/info.prop | sed 's/[^=]*=[[:space:]]*//' | tr -d ' \r')
          [ -n "$ver" ] && [ -n "$pid" ] || { echo "::error::plugin/info.prop 缺少 id/versionCode"; exit 1; }
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "pid=$pid" >> "$GITHUB_OUTPUT"
          echo "本次只构建产物 Regent-DREX-v$ver（不发 Release）"

      - name: 打包（QFun 标准格式）+ SHA256
        env:
          PID: ${{ steps.info.outputs.pid }}
          VER: ${{ steps.info.outputs.ver }}
        run: |
          set -euo pipefail
          for f in info.prop desc.txt main.java; do
            [ -f "plugin/$f" ] || { echo "::error::缺少 plugin/$f"; exit 1; }
          done
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path

          pid, ver = os.environ["PID"], os.environ["VER"]
          src = Path("plugin")
          out = Path(f"{pid}-v{ver}.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              z.writestr(f"{pid}/", "")
              for name in ("info.prop", "desc.txt", "main.java"):
                  z.write(src / name, f"{pid}/{name}")
          print(f"产物: {out} ({out.stat().st_size} 字节)")
          PY
          zipf=$(ls -1 *.zip | head -n1)
          sha256sum "$zipf" > "$zipf.sha256"
          cat "$zipf.sha256"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Regent-DREX-v${{ steps.info.outputs.ver }}
          path: |
            *.zip
            *.zip.sha256
          if-no-files-found: error
